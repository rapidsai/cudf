name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # DO NOT MERGE: GB300-only matrix for debugging the test_read_parquet_basic segfault.
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  gb300-bisect:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      matrix_type: nightly
      matrix_filter: map(select(.GPU == "gb300"))
      script: ci/gb300_bisect.sh
  wheel-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: ./.github/workflows/wheels-build-stage.yaml
    with:
      matrix_filter: map(select(.ARCH == "arm64" and (.CUDA_VER | startswith("13.")))) | group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
  wheel-tests-cudf:
    needs: [wheel-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      matrix_type: nightly
      matrix_filter: map(select(.GPU == "gb300"))
      script: env RUN_PYLIBCUDF_TESTS=true RUN_CUDF_TESTS=false RUN_CUDF_STREAMING_TESTS=false ci/test_wheel_cudf.sh
  gb300-validate:
    needs: [wheel-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      matrix_type: nightly
      matrix_filter: map(select(.GPU == "gb300"))
      script: ci/gb300_validate.sh
