# TEMPORARY (revert before merge): this file is stripped down to just the
# maven-publish end-to-end rehearsal.
#
#   java-fetch-prebuilt: downloads the cudf_java_maven_repo artifact from a
#                        known-good release-shaped prior run
#                        (${GITHUB_SERVER_URL}/rapidsai/cudf/actions/runs/30388790977)
#                        and re-uploads it under the same name in this run so
#                        the shared maven-publish workflow's
#                        actions/download-artifact step can consume it as if
#                        java-gather had run here.
#   java-publish:        exact copy of build.yaml's java-publish job, but
#                        pinned to the head commit of the shared-workflows
#                        PR under review (rapidsai/shared-workflows#606) and
#                        gated only on java-fetch-prebuilt so we skip the
#                        java-build / java-gather chain entirely.
#
# Restore the full PR workflow before merging.
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  java-fetch-prebuilt:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      # cudf_java_maven_repo from a prior run whose java-build ran with a
      # release-shaped GITHUB_REF (v26.08.0 tag). Verified locally in
      # release_testing/artifact2 to contain 26.08.0 (no -SNAPSHOT).
      PREBUILT_RUN_ID: "30388790977"
    steps:
      - name: Download cudf_java_maven_repo from prior run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cudf_java_maven_repo
          path: maven-repo
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREBUILT_RUN_ID }}
      - name: Re-upload cudf_java_maven_repo for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: maven-repo
          if-no-files-found: error

  java-publish:
    needs: [java-fetch-prebuilt]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@cdd06535f0e283219a630c95f720e94788221962 # paul-aiyedun/add_maven_publish_workflow
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_USERNAME: ${{ secrets.MAVEN_DEPLOY_USERNAME }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      publication-type: 'rc'
      artifact-name: cudf_java_maven_repo
      source-git-sha: ${{ github.sha }}
      # false = validate + drop (safe). true = stage PENDING for manual publish.
      stage-for-maven-central-publish: false
