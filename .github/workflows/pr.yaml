# TEMPORARY (revert before merge): this file is stripped down to the
# java-build -> java-gather -> java-publish chain copied from build.yaml, so a
# PR push rehearses the full Maven Central path end to end without spending CI
# time on the rest of the PR pipeline. Restore the full PR workflow before
# merging.
#
# Deviations from build.yaml, each required to make the chain runnable here:
#   - java-build drops `needs: [telemetry-setup]`, since that job is not copied.
#   - java-publish drops the `github.ref_type == 'tag'` gate, which is false on
#     a pull-request branch push.
#   - stage-for-maven-central-publish is false, so the bundle is validated and
#     dropped rather than staged in the Portal.
#
# Paired with the temporary GITHUB_REF override in
# java/ci/build_cudf_java_jar_in_container.sh, which forces the release-tag
# path so the produced artifact is release-shaped (no -SNAPSHOT).
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Build the cuDF Java JAR for every Maven classifier.
  java-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: "12.9", cuda_major: "12", arch: "x86_64", runner: "linux-amd64-cpu16" }
          - { cuda: "13.3", cuda_major: "13", arch: "x86_64", runner: "linux-amd64-cpu16" }
          - { cuda: "12.9", cuda_major: "12", arch: "aarch64", runner: "linux-arm64-cpu16" }
          - { cuda: "13.3", cuda_major: "13", arch: "aarch64", runner: "linux-arm64-cpu16" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build static libcudf
        run: |
          ./java/ci/build_static_libcudf.sh \
            --output-dir "${RUNNER_TEMP}/libcudf" \
            --cuda-version "${{ matrix.cuda }}"
      - name: Build cuDF Java JAR
        run: |
          ./java/ci/build_cudf_java_jar.sh \
            --libcudf-dir "${RUNNER_TEMP}/libcudf" \
            --output-dir "${RUNNER_TEMP}/jars" \
            --cuda-version "${{ matrix.cuda }}"
      - name: Upload per-entry JAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_cuda${{ matrix.cuda_major }}_${{ matrix.arch }}
          # Ship only the JARs and POMs. Exclude the per-classifier Maven build scratch dir.
          path: |
            ${{ runner.temp }}/jars
            !${{ runner.temp }}/jars/.mvn-temp-target
          if-no-files-found: error
  # Assemble the per-classifier JARs into one Maven-repository layout.
  java-gather:
    needs: [java-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Download per-entry JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cudf_java_cuda*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error

  # Publish tagged release candidates to Maven Central via the Sonatype
  # Central Publisher Portal.
  java-publish:
    needs: [java-gather]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@release/26.08
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      publication-type: 'rc'
      artifact-name: cudf_java_maven_repo
      source-git-sha: ${{ inputs.sha || github.sha }}
      # false = validate + drop (safe). true = stage PENDING for manual publish.
      stage-for-maven-central-publish: false
