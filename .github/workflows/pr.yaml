# TEMPORARY: stripped down to only what is needed to run the libcudf_streaming
# ucxx tests (UCX segfault debugging). Not for merge.
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - conda-cpp-build
      - conda-cpp-tests
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  conda-cpp-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_cpp.sh
  conda-cpp-tests:
    needs: [conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: pull-request
      # Copied from test.yaml (nightly): also run on the nightly GPU/driver matrix,
      # not just the (smaller) pull-request matrix.
      matrix_type: nightly,pull-request
      script: >-
        env
        RUN_LIBCUDF_TESTS=false
        RUN_EXAMPLES_TESTS=false
        RUN_LIBCUDF_KAFKA_TESTS=false
        RUN_LIBCUDF_STREAMING_TESTS=true
        ci/test_cpp.sh
      cache-paths: .cache/libcudf
      cache-key-prefix: libcudf-rtcx-v2
      cache-key-files: |
        cpp/CMakeLists.txt
        cpp/cmake/**
        cpp/include/cudf/**
        cpp/src/jit/**
        cpp/src/binaryop/jit/**
        cpp/src/join/jit/**
        cpp/src/transform/jit/**
        cpp/tests/**
        dependencies.yaml
      cache-key-matrix-fields: |
        CUDA_VER
        ARCH
        LINUX_VER
        GPU
        DRIVER
        DEPENDENCIES
      cache-read-only: true
      cache-environment: |
        LIBCUDF_KERNEL_CACHE_PATH=.cache/libcudf
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.GPU != "gb300" and .GPU != "gh200"))
