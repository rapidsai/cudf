# TEMPORARY: runs the manual Java release for the tagged release commit. This PR
# is not merging, but revert this commit anyway. Stripped to build.yaml's
# java-build -> java-gather -> java-publish chain, dropping the telemetry-setup
# dependency and the `github.ref_type == 'tag'` gate that a branch push fails.
# Paired with the GITHUB_REF override in
# java/ci/build_cudf_java_jar_in_container.sh.
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # TEMPORARY: drop a prior PENDING/VALIDATED Sonatype deployment before rebuilding
  # so the new java-publish upload is not blocked by the old one.
  drop-old-deployment:
    runs-on: linux-amd64-cpu4
    steps:
      - name: Drop Sonatype deployment if present
        env:
          MAVEN_DEPLOY_USERNAME: ${{ vars.MAVEN_DEPLOY_USERNAME }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
          DEPLOYMENT_ID: 6bf96242-4756-4ab2-8230-73427e51d564
          CENTRAL_PORTAL_URL: https://central.sonatype.com
        run: |
          set -euo pipefail
          : "${MAVEN_DEPLOY_USERNAME:?must be set}"
          : "${MAVEN_DEPLOY_TOKEN:?must be set}"
          AUTH="$(printf '%s:%s' "${MAVEN_DEPLOY_USERNAME}" "${MAVEN_DEPLOY_TOKEN}" | base64 | tr -d '\n')"
          status_url="${CENTRAL_PORTAL_URL}/api/v1/publisher/status?id=${DEPLOYMENT_ID}"
          drop_url="${CENTRAL_PORTAL_URL}/api/v1/publisher/deployment/${DEPLOYMENT_ID}"

          body="$(mktemp)"
          http="$(curl -sS --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${AUTH}" \
            -X POST -o "${body}" -w '%{http_code}' "${status_url}" || echo transport-error)"
          if [[ ${http} == 404 ]]; then
            echo "Deployment ${DEPLOYMENT_ID} not found; nothing to drop"
            rm -f "${body}"
            exit 0
          fi
          if [[ ${http} != 2* ]]; then
            echo "Status check failed (HTTP ${http}): $(cat "${body}")" >&2
            rm -f "${body}"
            exit 1
          fi
          state="$(jq -r '.deploymentState // empty' "${body}")"
          rm -f "${body}"
          if [[ ${state} != VALIDATED ]]; then
            echo "Expected VALIDATED or absent, got '${state:-UNKNOWN}'" >&2
            exit 1
          fi

          echo "Dropping VALIDATED deployment ${DEPLOYMENT_ID}"
          body="$(mktemp)"
          http="$(curl -sS --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${AUTH}" \
            -X DELETE -o "${body}" -w '%{http_code}' "${drop_url}" || echo transport-error)"
          if [[ ${http} != 2* ]]; then
            echo "Drop failed (HTTP ${http}): $(cat "${body}")" >&2
            rm -f "${body}"
            exit 1
          fi
          rm -f "${body}"
          echo "Dropped deployment ${DEPLOYMENT_ID}"

  # Build the cuDF Java JAR for every Maven classifier.
  java-build:
    needs: [drop-old-deployment]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: "12.9", cuda_major: "12", arch: "x86_64", runner: "linux-amd64-cpu16" }
          - { cuda: "13.3", cuda_major: "13", arch: "x86_64", runner: "linux-amd64-cpu16" }
          - { cuda: "12.9", cuda_major: "12", arch: "aarch64", runner: "linux-arm64-cpu16" }
          - { cuda: "13.3", cuda_major: "13", arch: "aarch64", runner: "linux-arm64-cpu16" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build static libcudf
        run: |
          ./java/ci/build_static_libcudf.sh \
            --output-dir "${RUNNER_TEMP}/libcudf" \
            --cuda-version "${{ matrix.cuda }}"
      - name: Build cuDF Java JAR
        run: |
          ./java/ci/build_cudf_java_jar.sh \
            --libcudf-dir "${RUNNER_TEMP}/libcudf" \
            --output-dir "${RUNNER_TEMP}/jars" \
            --cuda-version "${{ matrix.cuda }}"
      - name: Upload per-entry JAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_cuda${{ matrix.cuda_major }}_${{ matrix.arch }}
          # Ship only the JARs and POMs. Exclude the per-classifier Maven build scratch dir.
          path: |
            ${{ runner.temp }}/jars
            !${{ runner.temp }}/jars/.mvn-temp-target
          if-no-files-found: error
  # Assemble the per-classifier JARs into one Maven-repository layout.
  java-gather:
    needs: [java-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Download per-entry JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cudf_java_cuda*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error

  # Publish tagged release candidates to Maven Central via the Sonatype
  # Central Publisher Portal.
  java-publish:
    needs: [java-gather]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@release/26.08
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      publication-type: 'rc'
      artifact-name: cudf_java_maven_repo
      # Release commit, so the bundle records the release, not the PR commit.
      source-git-sha: ff5b362d7c06ae5837fd7a7337e2ae20895f324d
      # false = validate + drop (safe). true = stage PENDING for manual publish.
      stage-for-maven-central-publish: true
