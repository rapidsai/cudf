name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # DO NOT MERGE: GB300-only matrix for debugging the test_read_parquet_basic segfault.
  gb300-validate:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      matrix_type: nightly
      matrix_filter: map(select(.GPU == "gb300"))
      script: ci/gb300_validate.sh
