name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Please keep pr-builder as the top job here
  pr-builder:
    needs:
      - telemetry-setup
      - build-details
      - check-nightly-ci
      - changed-files
      - checks
      - conda-cpp-build
      - conda-python-build
      - conda-python-build-noarch
      - conda-python-cudf-polars-tests
      - conda-python-cudf-polars-tests-r2
      - conda-python-cudf-polars-tests-r3
      - conda-python-other-tests
      - conda-python-other-tests-r2
      - conda-python-other-tests-r3
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    permissions:
      id-token: write
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OTEL_SERVICE_NAME: 'pr-cudf'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  check-nightly-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get PR Info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Check if nightly CI is passing
        uses: rapidsai/shared-actions/check_nightly_success/dispatch@main
        with:
          repo: ${{ github.repository }}
          target-branch: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}
          max-days-without-success: 14
  changed-files:
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@main
    with:
      files_yaml: |
        build_docs:
          - 'docs/**'
          - 'cpp/doxygen/**'
          - 'cpp/include/**'
          - 'cpp/libcudf_kafka/include/**'
          - 'ci/build_docs.sh'
          - 'python/**'
        test_cpp_common:
          - 'conda/recipes/libcudf/**'
          - 'RAPIDS_BRANCH'
          - 'build.sh'
          - 'dependencies.yaml'
          - 'ci/build_cpp.sh'
          - 'ci/build_cpp_runtime.sh'
          - 'ci/test_cpp.sh'
          - 'ci/test_cpp_common.sh'
          - '.github/workflows/pr.yaml'
        test_cpp_libcudf:
          - 'ci/run_cudf_ctests.sh'
          - 'cpp/tests/**'
        test_cpp_examples:
          - 'ci/run_cudf_examples.sh'
          - 'cpp/examples/**'
        test_cpp_kafka:
          - 'ci/run_cudf_kafka_ctests.sh'
          - 'cpp/libcudf_kafka/tests/**'
        test_cpp_streaming:
          - 'ci/run_cudf_streaming_ctests.sh'
          - 'cpp/libcudf_streaming/examples/**'
          - 'cpp/libcudf_streaming/tests/**'
        cpp_test_files:
          - 'cpp/examples/**'
          - 'cpp/libcudf_kafka/tests/**'
          - 'cpp/libcudf_streaming/examples/**'
          - 'cpp/libcudf_streaming/tests/**'
          - 'cpp/tests/**'
        # Inputs shared by every C++ component. Changes here rebuild and retest everything.
        cpp_build_inputs_common:
          - 'cmake/**'
        # Changes to libcudf itself affect all dependent components (kafka, streaming, examples).
        cpp_build_inputs_libcudf:
          - 'cpp/CMakeLists.txt'
          - 'cpp/cmake/**'
          - 'cpp/include/**'
          - 'cpp/scripts/gdb-pretty-printers.py'
          - 'cpp/scripts/load-pretty-printers.in'
          - 'cpp/src/**'
        cpp_build_inputs_kafka:
          - 'cpp/libcudf_kafka/CMakeLists.txt'
          - 'cpp/libcudf_kafka/cmake/**'
          - 'cpp/libcudf_kafka/include/**'
          - 'cpp/libcudf_kafka/src/**'
        cpp_build_inputs_streaming:
          - 'cpp/libcudf_streaming/CMakeLists.txt'
          - 'cpp/libcudf_streaming/cmake/**'
          - 'cpp/libcudf_streaming/include/**'
          - 'cpp/libcudf_streaming/scripts/**'
          - 'cpp/libcudf_streaming/src/**'
        test_cmake:
          - 'ci/test_cmake.sh'
        devcontainer_build_inputs:
          - '.devcontainer/**'
          - '.github/workflows/pr.yaml'
          - 'RAPIDS_BRANCH'
          - 'cmake/**'
          - 'cpp/**'
          - 'dependencies.yaml'
          - 'python/**'
          - '!**/*.md'
        cpp_linters:
          - 'cpp/.clang-tidy'
          - 'cpp/scripts/parse_iwyu_output.py'
          - 'ci/cpp_linters.sh'
        unit_tests_cudf_pandas:
          - 'python/cudf/cudf/pandas/**'
          - 'ci/cudf_pandas_scripts/run_tests.sh'
          - 'ci/utils/get_matrix_values.py'
        test_java:
          - 'java/**'
          - 'RAPIDS_BRANCH'
          - 'dependencies.yaml'
          - 'ci/build_java.sh'
          - '.github/workflows/pr.yaml'
          - '.github/workflows/cudf-spark-jni.yaml'
        test_java_packaged:
          - 'ci/test_packaged_java.sh'
        test_notebooks:
          - 'python/cudf/**'
          - '!python/cudf/cudf/pandas/**'
          - 'python/dask_cudf/**'
          - 'notebooks/**'
          - 'dependencies.yaml'
          - 'ci/test_notebooks.sh'
          - 'ci/utils/nbtest.sh'
        test_python_all:
          - 'python/libcudf/**'
          - 'python/pylibcudf/**'
          - 'RAPIDS_BRANCH'
          - 'dependencies.yaml'
          - '.github/workflows/pr.yaml'
        test_python_cudf:
          - 'python/cudf/**'
        test_python_cudf_benchmarks:
          - 'python/cudf/**'
          - '!python/cudf/cudf/pandas/**'
        test_python_other:
          - 'ci/test_python_other.sh'
        test_python_dask_cudf:
          - 'python/dask_cudf/**'
          - 'ci/run_dask_cudf_pytests.sh'
        test_python_cudf_kafka:
          - 'python/cudf_kafka/**'
          - 'ci/run_cudf_kafka_pytests.sh'
        test_python_custreamz:
          - 'python/custreamz/**'
          - 'ci/run_custreamz_pytests.sh'
        test_python_cudf_streaming_runner:
          - 'ci/run_cudf_streaming_pytests.sh'
        test_python_cudf_polars:
          - 'python/cudf_polars/**'
          - '!python/cudf_polars/quent/**'
          - 'ci/test_python_cudf_polars.sh'
          - 'ci/test_python_cudf_polars_integrations.sh'
        test_cudf_polars_quent:
          - 'python/cudf_polars/cudf_polars/quent/**'
          - 'python/cudf_polars/quent/analyzer/**'
          - 'python/cudf_polars/quent/bridge/**'
          - 'python/cudf_polars/quent/model.yaml'
          - 'python/cudf_polars/tests/quent/**'
          - 'ci/test_cudf_polars_quent.sh'
          - 'ci/run_cudf_polars_quent_tests.sh'
        test_python_cudf_streaming:
          - 'python/cudf_streaming/**'
          - 'python/libcudf_streaming/**'
        test_python_conda_builds:
          - 'conda/**'
          - 'build.sh'
          - 'ci/build_cpp.sh'
          - 'ci/build_cpp_runtime.sh'
          - 'ci/build_python.sh'
          - 'ci/build_python_noarch.sh'
          - 'ci/build_python_common.sh'
          - 'ci/build_parallel.sh'
        test_python_conda_common:
          - 'ci/test_python_common.sh'
          - 'ci/test_python_imports.sh'
        test_python_conda_cudf:
          - 'ci/test_python_cudf.sh'
        test_python_conda_pylibcudf:
          - 'ci/run_pylibcudf_pytests.sh'
        test_python_conda_cudf_tests:
          - 'ci/run_cudf_pytests.sh'
        test_python_conda_cudf_benchmarks:
          - 'ci/run_cudf_pytest_benchmarks.sh'
          - 'ci/run_cudf_pandas_pytest_benchmarks.sh'
          - 'ci/run_pylibcudf_pytests.sh'
        test_python_cuml:
          - 'ci/test_cuml_compat.sh'
        test_python_narwhals:
          - 'ci/test_narwhals.sh'
        test_python_wheels:
          - 'ci/build_wheel_noarch.sh'
          - 'ci/build_wheel.sh'
          - 'ci/build_wheel_common.sh'
          - 'ci/build_parallel.sh'
          - 'ci/validate_wheel.sh'
          - '.github/workflows/build.yaml'
          - '.github/workflows/wheels-build-stage.yaml'
        test_python_wheel_cudf:
          - 'ci/test_wheel_cudf.sh'
        test_python_wheel_cudf_polars:
          - 'ci/test_wheel_cudf_polars.sh'
          - 'ci/utils/get_matrix_values.py'
        test_python_wheel_dask_cudf:
          - 'ci/test_wheel_dask_cudf.sh'
        test_python_cudf_polars_polars:
          - 'ci/analyze_cudf_polars_fallbacks.py'
          - 'ci/run_cudf_polars_fallback_diagnostics.sh'
          - 'ci/test_cudf_polars_polars_tests.sh'
          - 'ci/run_cudf_polars_polars_tests.sh'
          - 'ci/cudf_polars/polars_test_deselections*.txt'
        test_python_cudf_polars_runner:
          - 'ci/run_cudf_polars_pytests.sh'
        test_cudf_pandas_third_party_integration:
          - 'ci/cudf_pandas_scripts/third-party-integration/**'
        test_cudf_pandas_pandas_tests:
          - 'ci/cudf_pandas_scripts/pandas-tests/**'
        test_wheel_dask_cudf:
          - 'python/cudf/**'
          - '!python/cudf/cudf/pandas/**'
          - 'python/dask_cudf/**'
  checks:
    permissions:
      contents: read
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    with:
      enable_check_generated_files: false
      ignored_pr_jobs: "telemetry-summarize cudf-spark-jni cuml-compat-tests conda-python-cudf-polars-tests-integration-optional"
      # Main builds seed this cache. PR merge refs can restore it but should not create
      # duplicate archives that are inaccessible to other PRs.
      pre-commit-cache-read-only: true
  conda-cpp-build:
    needs: [build-details, checks, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: >-
        ${{ (
        fromJSON(needs.changed-files.outputs.changed_file_groups).cpp_build_inputs_common ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).cpp_build_inputs_libcudf ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).cpp_build_inputs_kafka ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).cpp_build_inputs_streaming ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp_common ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp_libcudf ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp_examples ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp_kafka ||
        fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp_streaming)
        && 'ci/build_cpp.sh' || 'ci/build_cpp_runtime.sh' }}
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0"))
  conda-python-build:
    needs: [build-details, conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      script: ci/build_python.sh
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0")) | group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  conda-python-build-noarch:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      script: ci/build_python_noarch.sh
      pure-conda: cuda_major
  conda-python-cudf-polars-tests:
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: "env POLARS_VERSIONS=latest ci/test_python_cudf_polars.sh"
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0" and .PY_VER == "3.13" and .LINUX_VER == "ubuntu26.04" and .GPU == "l4" and .DRIVER == "latest" and .DEPENDENCIES == "latest"))
  conda-python-cudf-polars-tests-r2:
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: "env POLARS_VERSIONS=latest ci/test_python_cudf_polars.sh"
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0" and .PY_VER == "3.13" and .LINUX_VER == "ubuntu26.04" and .GPU == "l4" and .DRIVER == "latest" and .DEPENDENCIES == "latest"))
  conda-python-cudf-polars-tests-r3:
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: "env POLARS_VERSIONS=latest ci/test_python_cudf_polars.sh"
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0" and .PY_VER == "3.13" and .LINUX_VER == "ubuntu26.04" and .GPU == "l4" and .DRIVER == "latest" and .DEPENDENCIES == "latest"))
  conda-python-other-tests:
    # Tests for dask_cudf, cudf_kafka, custreamz, and cudf_streaming run separately from cudf_polars.
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: env RUN_DASK_CUDF_TESTS=false RUN_CUDF_KAFKA_TESTS=false RUN_CUSTREAMZ_TESTS=false RUN_CUDF_STREAMING_TESTS=true ci/test_python_other.sh
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0" and .PY_VER == "3.13" and .LINUX_VER == "ubuntu26.04" and .GPU == "l4" and .DRIVER == "latest" and .DEPENDENCIES == "latest"))
  # Build and test the cuDF Java JAR for every Maven classifier.
  conda-python-other-tests-r2:
    # Tests for dask_cudf, cudf_kafka, custreamz, and cudf_streaming run separately from cudf_polars.
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: env RUN_DASK_CUDF_TESTS=false RUN_CUDF_KAFKA_TESTS=false RUN_CUSTREAMZ_TESTS=false RUN_CUDF_STREAMING_TESTS=true ci/test_python_other.sh
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0" and .PY_VER == "3.13" and .LINUX_VER == "ubuntu26.04" and .GPU == "l4" and .DRIVER == "latest" and .DEPENDENCIES == "latest"))
  # Build and test the cuDF Java JAR for every Maven classifier.
  conda-python-other-tests-r3:
    # Tests for dask_cudf, cudf_kafka, custreamz, and cudf_streaming run separately from cudf_polars.
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: env RUN_DASK_CUDF_TESTS=false RUN_CUDF_KAFKA_TESTS=false RUN_CUSTREAMZ_TESTS=false RUN_CUDF_STREAMING_TESTS=true ci/test_python_other.sh
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.ARCH == "arm64" and .CUDA_VER == "13.3.0" and .PY_VER == "3.13" and .LINUX_VER == "ubuntu26.04" and .GPU == "l4" and .DRIVER == "latest" and .DEPENDENCIES == "latest"))
  # Build and test the cuDF Java JAR for every Maven classifier.
  telemetry-summarize:
    # This job must use a self-hosted runner to record telemetry traces.
    runs-on: linux-amd64-cpu4
    permissions:
      actions: write
    needs: pr-builder
    if: ${{ vars.TELEMETRY_ENABLED == 'true' && !cancelled() }}
    continue-on-error: true
    steps:
      - name: Telemetry summarize
        uses: rapidsai/shared-actions/telemetry-dispatch-summarize@main
    env:
      GH_TOKEN: ${{ github.token }}
