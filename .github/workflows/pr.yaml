# TEMPORARY (revert before merge): this file is stripped down to just the
# java-build / java-gather rehearsal chain so a PR push can produce the
# cudf_java_maven_repo artifact used by the maven-publish end-to-end test
# without spending CI time on the rest of the PR pipeline. Restore the full
# PR workflow before merging.
#
# Paired with the temporary in-container GITHUB_REF override in
# java/ci/build_cudf_java_jar_in_container.sh, which forces the release-tag
# path so the produced artifact is release-shaped (no -SNAPSHOT).
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  telemetry-setup:
    permissions:
      id-token: write
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OTEL_SERVICE_NAME: 'pr-cudf'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  # Copy of build.yaml's java-build. Mirror any build.yaml edits here.
  java-build:
    needs: [telemetry-setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: "12.9", cuda_major: "12", arch: "x86_64", runner: "linux-amd64-cpu16" }
          - { cuda: "13.3", cuda_major: "13", arch: "x86_64", runner: "linux-amd64-cpu16" }
          - { cuda: "12.9", cuda_major: "12", arch: "aarch64", runner: "linux-arm64-cpu16" }
          - { cuda: "13.3", cuda_major: "13", arch: "aarch64", runner: "linux-arm64-cpu16" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build static libcudf
        run: |
          ./java/ci/build_static_libcudf.sh \
            --output-dir "${RUNNER_TEMP}/libcudf" \
            --cuda-version "${{ matrix.cuda }}"
      - name: Build cuDF Java JAR
        run: |
          ./java/ci/build_cudf_java_jar.sh \
            --libcudf-dir "${RUNNER_TEMP}/libcudf" \
            --output-dir "${RUNNER_TEMP}/jars" \
            --cuda-version "${{ matrix.cuda }}"
      - name: Upload per-entry JAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_cuda${{ matrix.cuda_major }}_${{ matrix.arch }}
          # Ship only the JARs and POMs. Exclude the per-classifier Maven build scratch dir.
          path: |
            ${{ runner.temp }}/jars
            !${{ runner.temp }}/jars/.mvn-temp-target
          if-no-files-found: error
  # Copy of build.yaml's java-gather. Rehearsal companion to java-build.
  java-gather:
    needs: [java-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Download per-entry JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cudf_java_cuda*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error
