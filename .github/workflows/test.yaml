name: "Polars merged #24566 full-shard validation"
on:
  workflow_dispatch:
permissions: {}
jobs:
  cudf-polars-polars-tests-parquet-cancellation-validation:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      branch: pull-request/24568
      date: '2026-10-13'
      sha: 0f8efa10ac32ebe59013c2e3f9e9e1f7d6dee9dd
      matrix_filter: map(select(.GPU == "rtxpro6000" or (.GPU == "l4" and .ARCH == "arm64")))
      script: ci/test_cudf_polars_polars_tests.sh --engine spmd --inject-gpu-engine-blocksize small --run-slow --cudf-polars-shard-id 0 --cudf-polars-num-shards 2
