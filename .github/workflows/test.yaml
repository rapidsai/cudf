name: Polars upstream-main callback crash control
on:
  workflow_dispatch:
permissions: {}
jobs:
  cudf-polars-polars-tests-main-callback-control:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      branch: pull-request/24568
      date: '2026-10-13'
      sha: f5d3786c381c4801d17f0ea0a7ea995f0c4c0e23
      matrix_filter: map(select(.GPU == "rtxpro6000"))
      script: |
        control_dir=$(mktemp -d)
        gh api 'repos/NVIDIA/cudf/contents/.ci-probes/main_callback_control.py?ref=2d841d677f90ca6fc32d08d6c06bfc3b3b4b2e0a' --jq .content | base64 --decode > "${control_dir}/main_callback_control.py"
        gh api 'repos/NVIDIA/cudf/contents/python/cudf_polars/cudf_polars/callback.py?ref=bfac55d1aacf560770ca422d32fe6cb0f1cbeff0' --jq .content | base64 --decode > "${control_dir}/upstream_callback.py"
        PYTHONPATH="${control_dir}" CUDF_POLARS_MAIN_CALLBACK_SOURCE="${control_dir}/upstream_callback.py" \
          ci/test_cudf_polars_polars_tests.sh --engine spmd \
          --inject-gpu-engine-blocksize small --run-slow \
          --cudf-polars-shard-id 0 --cudf-polars-num-shards 2 \
          -p main_callback_control
